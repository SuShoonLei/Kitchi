services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kitchi}
      POSTGRES_USER: ${POSTGRES_USER:-kitchi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - kitchi_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kitchi} -d ${POSTGRES_DB:-kitchi}"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  kitchi_pg:
